name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: CI only checks out and tests code; it never writes to the
# repo, so the workflow token gets read-only access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # actions/setup-python has built-in pip caching; pointing it at
          # requirements.txt keys the cache on that file's hash so cached
          # wheels are reused until a dependency actually changes.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # The --extra-index-url pulls the CPU-only PyTorch wheels (also pinned
        # inside requirements.txt) so we don't download the ~2 GB CUDA build
        # on a runner that has no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint with flake8
        # Relaxed settings: this project has many long comment/docstring
        # lines (E501) and uses the black-style "break before binary operator"
        # convention (W503) — both are intentional stylistic choices.
        run: flake8 . --max-line-length 120 --ignore E501,W503

      - name: Eval pipeline dry-run
        # Exercises argparse, benchmark CSV parsing, and the repo-root import
        # path without making any LLM calls — so it runs without GEMINI_API_KEY.
        run: python -m eval.run_eval --dry-run

      - name: Retrieval eval dry-run
        # Loads the benchmark and eval/benchmark_chunks.json and checks that
        # every item still has a chunk label. No index, no model, no LLM call.
        # Fails if the labels file goes missing or stops matching the benchmark.
        run: python -m eval.run_retrieval_eval --dry-run

      - name: Quality gate dry-run
        # Validates eval/ci_gate.json against the committed results files it
        # names: every threshold must sit at or below the value it was set
        # from, so a threshold can never be edited above what was measured.
        run: python -m eval.ci_gate retrieval --dry-run

      - name: Run pytest
        # No zero-test escape hatch. This step used to treat pytest's exit code
        # 5 ("collected no tests") as success, from when the suite was empty.
        # Left in place it would let the entire suite disappear — a deleted
        # conftest, a renamed directory, a bad import in every test module —
        # while CI stayed green. --strict-markers and -p no:cacheprovider keep
        # the run reproducible on a clean runner.
        run: python -m pytest --tb=short --strict-markers -p no:cacheprovider

  retrieval-gate:
    # The quality gate (eval/ci_gate.py): the two gated retrieval
    # configurations are scored against the labelled benchmark on the
    # committed index slice (eval/ci_corpus.py) and the build fails below
    # the thresholds in eval/ci_gate.json. No LLM call and no secret. The
    # slice is embedded once (a few minutes) and cached on its own hash;
    # a warm run restores it in seconds. The judged, paid half of the gate
    # is a manual workflow: eval-judged.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache the embedding and reranker models
        # all-MiniLM-L6-v2 and cross-encoder/ms-marco-MiniLM-L-6-v2, ~90 MB
        # each, keyed on the files that name them.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('ingestion/embedder.py', 'retrieval/rerank.py') }}

      - name: Restore the CI index
        # Keyed on the slice and on everything that decides how it is
        # embedded; a change to any of them rebuilds rather than reuses.
        id: index-cache
        uses: actions/cache@v4
        with:
          path: data/chroma_db
          key: ci-index-${{ hashFiles('eval/ci_corpus.jsonl.gz', 'ingestion/embedder.py', 'requirements.txt') }}

      - name: Build the CI index from the committed slice
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: python -m eval.ci_corpus index

      - name: Retrieval quality gate
        # Writes the PASS/FAIL table to the run's summary page and the
        # per-item results to eval/results/ci/ (gitignored; uploaded below).
        run: python -m eval.ci_gate retrieval

      - name: Upload per-item results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-gate-results
          path: eval/results/ci/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest

    # All frontend commands run inside the Next.js app directory.
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          # Node 22, not 20: vitest 4 requires >=20.19 and fails to load its own
          # config on older 20.x with ERR_REQUIRE_ESM. Node 20 also reached
          # end-of-life in April 2026. Keep this in step with the engines field
          # in web/package.json.
          node-version: "22"
          # Cache the npm download cache, keyed on the frontend lockfile.
          # cache-dependency-path is resolved from the repo root, not the
          # working-directory default above.
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # npm ci installs exactly what's in package-lock.json (reproducible).
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        # Validates TypeScript, Tailwind, and the production bundle. No env file
        # is committed: NEXT_PUBLIC_API_BASE_URL falls back to the code default
        # (http://localhost:8080, web/lib/config.ts) and is set per environment
        # at deploy time (Vercel).
        run: npm run build
