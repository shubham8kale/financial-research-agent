services:
  mcp-server:
    build: .
    command: python -m mcp_server.server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      # Uses Python, not `nc`: the base image is python:3.11-slim, which ships
      # no netcat, so the previous `nc -z` check could only ever fail and the
      # container never reported healthy. Python is guaranteed present.
      test:
        - CMD-SHELL
        - python -c "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('127.0.0.1',8000)))"
      interval: 30s
      timeout: 5s
      retries: 3

  api-server:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
    depends_on:
      - mcp-server
